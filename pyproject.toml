[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-uncertainty-quantification"
version = "0.1.0"
description = "Reliability evaluation of a clinical RAG system"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rag_uncertainty*"]